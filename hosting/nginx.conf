# Include this file from an existing nginx http {} block.
# Replace /srv/sky and the example listener/server_name for your deployment.
# This adds a static site only; it does not configure TLS, a backend, or authentication.

map $arg_v $sky_query_version {
    default 0;
    ~^[A-Za-z0-9._-]+$ 1;
}
map $uri $sky_name_version {
    default 0;
    ~*\.mobile-v[0-9]+\.(webm|mp4|webp)$ 1;
}
map $uri $sky_cacheable_asset {
    default 0;
    ~*\.(css|js|mjs|json|svg|webp|png|jpg|jpeg|gif|avif|ico|mp4|webm|mp3|ogg|woff|woff2)$ 1;
}
map "$sky_query_version:$sky_name_version:$sky_cacheable_asset" $sky_versioned_asset {
    default 0;
    "1:0:1" 1;
    "0:1:1" 1;
    "1:1:1" 1;
}
map "$status:$sky_versioned_asset" $sky_cache_control {
    default "no-store";
    ~^(200|206|304):0$ "no-cache";
    ~^(200|206|304):1$ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /srv/sky;
    index index.html;

    etag on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml text/plain application/xml text/xml application/manifest+json;
    # text/html is included by nginx automatically. Video/image encodings are omitted.
    add_header Cache-Control $sky_cache_control always;
    max_ranges 1;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(mp4|webm)$ {
        gzip off;
        try_files $uri =404;
        # nginx's static handler supplies uncompressed byte ranges and conditional requests.
    }
}
