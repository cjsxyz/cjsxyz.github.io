<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>chris</title>
<meta name="description" content="chris’ website">
<meta name="theme-color" content="#111110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16'/%3E%3C/svg%3E">
<style>
  html { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #111110; }
  body {
    margin: 0;
    height: 100%;
    display: grid;
    place-items: center;
    padding: min(48px, 8vh) 24px;
    box-sizing: border-box;
    color: #ededeb;
    font: clamp(17px, 4.5vw, 18px)/1.6 system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; }
  h1 { font: inherit; font-weight: 600; margin: 0 0 1.2em; letter-spacing: -0.01em; }
  p { margin: 0; color: #a1a19c; text-wrap: pretty; }
  a { color: #ededeb; text-decoration: underline 1px #4a4a46; text-underline-offset: 3px; transition: text-decoration-color 150ms; }
  a:hover { text-decoration-color: currentColor; }
</style>
</head>
<body>
<main>
  <h1>Hey, I’m Chris.</h1>
  <p>I’m currently at <a href="https://www.paradigm.xyz">Paradigm</a>, where I help early-stage founders build out their teams. I enjoy connecting with interesting people working on hard problems. Feel free to <a href="mailto:chris@paradigm.xyz">reach out</a>.</p>
</main>
<script>
  // iOS Safari ignores user-scalable=no, so block pinch-zoom directly.
  for (const e of ["gesturestart", "gesturechange"]) document.addEventListener(e, ev => ev.preventDefault(), { passive: false });
</script>
</body>
</html>
