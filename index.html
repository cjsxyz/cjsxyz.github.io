    <script src="./weather.js?v=weather-scenes-118" async fetchpriority="high" data-weather-startup></script>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg?v=weather-scenes-100" />
    <script>
      (() => {
        // Old preview links must never pin the public page to outdated weather.
        const url = new URL(location.href);
        if (url.searchParams.has('scene') || url.searchParams.has('mode')) {
          url.searchParams.delete('scene');
          url.searchParams.delete('mode');
          history.replaceState(history.state, '', url);
        }
        document.documentElement.dataset.scene = 'cloudy';
      })();
    </script>
    <link rel="stylesheet" href="./style.css?v=weather-scenes-118" />
    <script src="./sky.js?v=weather-scenes-118" defer></script>
    <script type="module" src="./dock-sounds.js?v=weather-scenes-79"></script>
    <script src="./dock.js?v=weather-scenes-120" defer></script>
  </head>
  <body>
    <main class="sky" aria-label="Blue sky with white clouds floating by" aria-description="Cloud expands the dock to show current SF weather; User opens information about Chris; Email copies Chris's email address. Space pauses or resumes the sky. Escape pauses it." aria-keyshortcuts="Space Escape">
      <noscript><img class="scene-poster" src="./assets/clouds-poster.webp?v=weather-scenes-79" alt="White clouds across a blue sky" /></noscript>
      <div class="scene-layer scene-cloudy" data-scene="cloudy">
        <img class="scene-poster" data-src="./assets/clouds-poster.webp?v=weather-scenes-79" data-preview="./assets/clouds-poster.preview-v118.webp" alt="" fetchpriority="high" />
        <video id="sky-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="White clouds drifting across a blue sky" hidden></video>
      </div>
      <div class="scene-layer scene-sunny" data-scene="sunny" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/sunny-poster.webp?v=weather-scenes-79" data-preview="./assets/sunny-poster.preview-v118.webp" alt="" />
        <video id="sunny-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="A clear blue sky with bright sunlight" hidden></video>
      </div>
      <div class="scene-layer scene-overcast" data-scene="overcast" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/overcast-poster.webp?v=weather-scenes-79" data-preview="./assets/overcast-poster.preview-v118.webp" alt="" />
        <video id="overcast-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="Soft gray overcast clouds drifting across a muted sky" hidden></video>
      </div>
      <div class="scene-layer scene-rain" data-scene="rain" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/rain-poster.webp?v=weather-scenes-79" data-preview="./assets/rain-poster.preview-v118.webp" alt="" />
        <video id="rain-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="Soft rain beneath an overcast sky" hidden></video>
      </div>
      <div class="scene-layer scene-fog" data-scene="fog" aria-hidden="true">
        <div class="fog-atmosphere">
          <img class="scene-poster" data-src="./assets/fog-poster.webp?v=weather-scenes-79" data-preview="./assets/fog-poster.preview-v118.webp" alt="" />
          <video id="fog-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="Soft fog and low marine clouds drifting across the sky" hidden></video>
        </div>
      </div>
      <div class="scene-layer scene-night" data-scene="night" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/night-poster.webp?v=weather-scenes-79" data-preview="./assets/night-poster.preview-v118.webp" alt="" />
        <video id="night-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="Night clouds lit by moonlight from the upper right" hidden></video>
      </div>
      <div class="scene-layer scene-clear-night" data-scene="clear-night" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/clear-night-poster.webp?v=weather-scenes-79" data-preview="./assets/clear-night-poster.preview-v118.webp" alt="" />
        <video id="clear-night-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="A clear deep blue night sky with soft light from the upper right" hidden></video>
      </div>
      <div class="scene-layer scene-overcast-night" data-scene="overcast-night" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/overcast-night-poster.webp?v=weather-scenes-79" data-preview="./assets/overcast-night-poster.preview-v118.webp" alt="" />
        <video id="overcast-night-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="A dim blue-gray cloud ceiling drifting slowly through the night" hidden></video>
      </div>
      <div class="scene-layer scene-night-rain" data-scene="night-rain" aria-hidden="true">
        <img class="scene-poster" data-src="./assets/night-rain-poster.webp?v=weather-scenes-79" data-preview="./assets/night-rain-poster.preview-v118.webp" alt="" />
        <video id="night-rain-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="Fine rain falling through a dark blue-gray night sky" hidden></video>
      </div>
      <div class="scene-layer scene-night-fog" data-scene="night-fog" aria-hidden="true">
        <div class="fog-atmosphere">
        <img class="scene-poster" data-src="./assets/night-fog-poster.webp?v=weather-scenes-79" data-preview="./assets/night-fog-poster.preview-v118.webp" alt="" />
        <video id="night-fog-video" class="sky-scene" muted loop playsinline preload="none" disablepictureinpicture aria-label="Soft coastal fog moving through dim nighttime light" hidden></video>
        </div>
      </div>
      <div class="icon-dock" role="group" aria-label="Dock" data-selection="cloud" data-panel-open="false">
        <section id="dock-panel" class="dock-panel" aria-label="Current weather in San Francisco" aria-hidden="true" inert>
          <div class="dock-panel-content">
            <p id="weather-summary" class="weather-summary">Checking weather in San Francisco…</p>
            <p id="copy-summary" class="weather-summary" role="status" aria-live="polite" aria-atomic="true" hidden></p>
            <div id="bio-summary" class="bio-summary" tabindex="-1" hidden>
              <p>Conversation and vibes at Paradigm. Building a homestead in the Napa mountains.</p>
            </div>
            <div class="dock-divider" aria-hidden="true"></div>
          </div>
        </section>
        <div class="dock-track">
          <button class="dock-item" type="button" data-view="cloud" aria-label="Cloud" aria-pressed="true" data-selected="true" aria-expanded="false" aria-controls="dock-panel">
            <svg aria-hidden="true" focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
            </svg>
          </button>
          <button class="dock-item" type="button" data-view="user" aria-label="User" aria-pressed="false" data-selected="false" aria-expanded="false" aria-controls="dock-panel">
            <svg aria-hidden="true" focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
              <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
            </svg>
          </button>
          <button class="dock-item" type="button" data-view="mail" aria-label="Copy email address" aria-pressed="false" data-selected="false" aria-expanded="false" aria-controls="dock-panel">
            <svg aria-hidden="true" focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
              <path d="M3 7l9 6l9 -6" />
            </svg>
          </button>
        </div>
      </div>
      <span id="weather-condition" class="visually-hidden" role="status"></span>
      <span id="weather-freshness" class="visually-hidden"></span>
      <span class="visually-hidden">Weather data by <a href="https://open-meteo.com/" tabindex="-1" target="_blank" rel="noopener noreferrer">Open-Meteo</a>.</span>
      <span id="scene-status" class="visually-hidden" role="status"></span>
    </main>
  </body>
</html>
