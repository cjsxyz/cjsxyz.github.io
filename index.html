<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>chris</title>
<meta name="description" content="chris’ website">
<meta name="theme-color" content="#111110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: oklch(0.18 0.002 106);
    --fg: oklch(0.95 0.003 106);
    --muted: oklch(0.71 0.007 106);
    --line: oklch(0.41 0.006 106);
  }
  html { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: var(--bg); }
  body {
    margin: 0;
    height: 100%;
    display: grid;
    place-items: center;
    padding: min(48px, 8vh) 24px;
    box-sizing: border-box;
    color: var(--fg);
    font: clamp(12px, min(max(17px, 4.5vw), 5.4vh), 18px)/1.6 system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
  }
  main { max-width: 34rem; }
  h1 { font: inherit; font-weight: 600; margin: 0 0 1.2em; }
  p { margin: 0; color: var(--muted); text-wrap: pretty; }
  p + p { margin-top: 1.2em; }
  a { color: var(--fg); text-decoration: underline 1px var(--line); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
</style>
</head>
<body>
<main>
  <h1>Hi, I’m Chris.</h1>
  <p>I’m currently at <a href="https://www.paradigm.xyz">Paradigm</a>, where I think about what talent means as a function within organizations. When I’m not doing that, I enjoy learning from people working on hard problems and helping early-stage founders with hiring.</p>
  <p>Feel free to <a href="mailto:chris@paradigm.xyz">reach out</a>.</p>
</main>
<script>
  for (const e of ["gesturestart", "gesturechange"]) document.addEventListener(e, ev => ev.preventDefault(), { passive: false });
</script>
</body>
</html>
